name: Build site from BibTeX

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - bibliography/biblio_a.bib
      - bibliography/biblio_b.bib
      - bibliography/biblio_bb.bib
      - bibliography/biblio_c.bib
      - bibliography/biblio_j.bib
      - bibliography/biblio_r.bib
      - bibliography/biblio_t.bib
      - bibliography/biblio_u.bib
      - bibliography/biblio_w.bib

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and validate from local BibTeX
        run: python scripts/build_publications.py
      - name: Create review branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The generated site is already up to date."
            exit 0
          fi
          branch="automation/bibtex-build-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add bibliography/biblio_all.bib bibliography/biblio_top.bib bibliography/downloads \
            data/reports/bibliography_report.json publications.html index.html
          git commit -m "Rebuild site from canonical BibTeX"
          git push --set-upstream origin "$branch"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "Rebuild publications from BibTeX" \
            --body "Offline rebuild from the canonical BibTeX files. No publication data was downloaded from external sources. Review the generated pages, citation files, and bibliography report before merging."
